<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DBFL News</title><link rel="stylesheet" href="css/dbfl-site.css"></head><body><header class="dbfl-header"><a href="dbfl.html"><img src="assets/logos/dbfl-40-white.svg" alt="DBFL"></a><nav class="dbfl-nav"><a href="projects.html">Projects</a><a href="news.html">News</a><a href="index.html">40 Years</a><a class="editor-link" href="admin.html">Open Editor</a></nav></header><main id="articleRoot"></main><footer class="dbfl-footer"><img src="assets/logos/dbfl-40-white.svg" alt="DBFL"></footer><script src="js/content-store.js"></script><script>const id=new URLSearchParams(location.search).get('id');const item=DBFLContent.load().news.find(n=>n.id===id&&n.status==='published');const root=document.getElementById('articleRoot');if(!item){root.innerHTML='<section class="page-hero"><h1>Article not found</h1></section>'}else{document.title=item.title+' | DBFL';root.innerHTML=`<section class="page-hero"><p class="kicker">${DBFLContent.escape(item.category)} · ${DBFLContent.escape(item.date)}</p><h1>${DBFLContent.escape(item.title)}</h1></section>${item.image?`<div style="height:min(58vw,650px);background:center/cover url('${item.image.replace(/'/g,'')}')"></div>`:''}<div class="article-wrap"><article class="article-body"><p class="lead">${DBFLContent.escape(item.excerpt)}</p><p>${DBFLContent.escape(item.body)}</p></article><aside class="article-aside"><a href="news.html">Back to News &amp; Insights</a></aside></div>`}</script></body></html>

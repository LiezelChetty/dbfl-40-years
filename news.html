<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>News &amp; Insights | DBFL</title><link rel="stylesheet" href="css/dbfl-site.css"></head><body><header class="dbfl-header"><a href="dbfl.html"><img src="assets/logos/dbfl-40-white.svg" alt="DBFL"></a><nav class="dbfl-nav"><a href="page.html?slug=about-us">About Us</a><a href="page.html?slug=what-we-do">What We Do</a><a href="projects.html">Projects</a><a href="news.html">News</a><a class="editor-link" href="admin.html">Open Editor</a></nav></header><main><section class="page-hero"><p class="kicker">What’s happening across our industry</p><h1>News &amp; Insights</h1></section><section class="content-section"><div class="filterbar"><button class="active" data-filter="All">All Topics</button><button data-filter="Featured">Featured</button><button data-filter="News">News</button></div><div class="news-grid" id="newsGrid"></div></section></main><footer class="dbfl-footer"><img src="assets/logos/dbfl-40-white.svg" alt="DBFL"></footer><script src="js/content-store.js"></script><script>const data=DBFLContent.load(),grid=document.getElementById('newsGrid');function draw(filter='All'){grid.innerHTML=data.news.filter(n=>n.status==='published'&&(filter==='All'||n.category===filter)).map(n=>`<article class="content-card"><p class="kicker">${DBFLContent.escape(n.category)} · ${DBFLContent.escape(n.date)}</p><h3>${DBFLContent.escape(n.title)}</h3><p>${DBFLContent.escape(n.excerpt)}</p><a href="article.html?id=${encodeURIComponent(n.id)}">Read article</a></article>`).join('')||'<p>No published articles in this category.</p>'}draw();document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-filter]').forEach(x=>x.classList.remove('active'));b.classList.add('active');draw(b.dataset.filter)})</script></body></html>
